name: Build Release APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with this build?"
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if provided)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # 直接执行构建，并将 Secrets 传给环境变量
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*-release.apk" | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
      - name: Print APK info
        run: |
          ls -la "${{ steps.apk.outputs.apk }}"
      - name: Create / update GitHub Release and upload APK
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk }}
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperglow-release-${{ github.sha }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
